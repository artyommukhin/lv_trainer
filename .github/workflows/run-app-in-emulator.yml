name: Run Release Version in Emulator

on:
  pull_request:
    branches: [ master ]

jobs:
  run-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: "keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Enable KVM for Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run App on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          arch: x86_64
          script: |
            echo "Installing APK..."
            adb install app/build/outputs/apk/release/app-release.apk
            
            echo "Clearing old system logs..."
            adb logcat -c
            
            echo "Launching main activity..."
            adb shell monkey -p ru.artyommukhin.lvtrainer -c android.intent.category.LAUNCHER 1
            
            echo "Waiting 10 seconds to verify app stability..."
            sleep 10
            
            echo "Checking if app process is still alive..."
            if adb shell pidof ru.artyommukhin.lvtrainer > /dev/null; then
              echo "✅ Success: App is running successfully!"
              exit 0
            else
              echo "❌ Error: App crashed or failed to start!"
              echo "Dumping full logcat to logcat.txt..."
              adb logcat -d > logcat.txt
              exit 1
            fi

      - name: Upload Logcat Crash Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          retention-days: 30